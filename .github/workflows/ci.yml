name: App checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOT_ENABLED: "false"
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_WRITE_LOGS: "false"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: pid_cable_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d pid_cable_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check accounting and API
        run: npm test

      - name: Check Timeweb adapters
        run: node --test tests/timeweb.test.mjs

      - name: Check real PostgreSQL and repeat migrations
        run: node scripts/test-api.mjs
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/pid_cable_test

      - name: Check TypeScript
        run: node node_modules/typescript/bin/tsc --noEmit --incremental false

      - name: Build Cloudflare application
        run: node node_modules/vinext/dist/cli.js build

      - name: Build Timeweb container
        run: docker build -t pid-cable:test .

      - name: Check production container
        env:
          DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/pid_cable_test
          DATABASE_SSL: "false"
          TELEGRAM_BOT_TOKEN: ci-only-bot-token
          ADMIN_TELEGRAM_ID: "123456789"
        run: |
          docker run -d --name pid-cable-smoke --network host \
            -e DATABASE_URL -e DATABASE_SSL -e TELEGRAM_BOT_TOKEN -e ADMIN_TELEGRAM_ID pid-cable:test
          node scripts/smoke-timeweb.mjs
          docker restart pid-cable-smoke
          SMOKE_EXPECT_SAVED=true node scripts/smoke-timeweb.mjs

      - name: Container diagnostics
        if: failure()
        run: docker logs pid-cable-smoke || true

      - name: Stop test container
        if: always()
        run: docker rm -f pid-cable-smoke || true

  release:
    name: Publish verified release branch
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Advance release after all checks pass
        run: node scripts/promote-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
